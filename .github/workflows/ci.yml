name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  esp32s3-build:
    name: ESP-IDF 5.3.5 / ESP32-S3 ${{ matrix.profile }} / baseline
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [n8r8, tinys3d]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Clean configure and build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.5
          target: esp32s3
          path: .
          command: bash ci/build-esp32s3.sh ${{ matrix.profile }} baseline

  fan-characterization-refusal:
    name: ESP-IDF 5.3.5 / fan-characterization refuses a build without wiring
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Build the experiment profile without its wiring overlay
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.5
          target: esp32s3
          path: .
          command: bash ci/build-esp32s3.sh tinys3d fan-characterization --expect-refusal

  python-host:
    name: Python host contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tooling dependencies
        run: pip install -r tools/requirements.txt
      - name: Run tests
        env:
          DRAGONBENCH_REQUIRE_NODE: "1"
        run: |
          node --version
          python -m unittest discover -s tests -v
      - name: Run reset characterization tooling tests
        run: python -m unittest tools.tests.test_parsing -v
      - name: Compile Python sources
        run: python -m compileall -q cli tests tools
      - name: Verify invalid input returns exit 2
        shell: bash
        run: |
          set +e
          python -m cli.dragonbench run IDLE --duration 0
          status=$?
          test "$status" -eq 2
          python -m cli.dragonbench fan-sweep --pwm-hz 0 --low-pct 0 --high-pct 10 --step-pct 5 --order up --hold-ms 1000 --output sweep.json
          status=$?
          set -e
          test "$status" -eq 2

  native-c:
    name: Native C state machine (${{ matrix.experiment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - experiment: baseline
            defines: ""
          - experiment: fan-characterization
            defines: "-DCONFIG_DB_EXPERIMENT_FAN_CHARACTERIZATION=1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Compile with warnings and sanitizers
        run: |
          for test in test_db_run test_db_fan; do
            gcc -std=c11 -Wall -Wextra -Wpedantic -Werror \
              -fsanitize=address,undefined -fno-omit-frame-pointer ${{ matrix.defines }} \
              -Ifirmware/common/include \
              firmware/common/db_run.c firmware/common/db_network.c firmware/common/db_fan.c \
              tests/native/$test.c -o $test
          done
      - name: Execute state-machine and fan-characterization tests
        run: |
          ./test_db_run
          ./test_db_fan
